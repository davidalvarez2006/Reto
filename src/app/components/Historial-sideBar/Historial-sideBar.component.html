<!-- Botón hamburguesa solo visible en móvil -->
<button class="hamburger" (click)="toggleMobileMenu()" *ngIf="isMobile" [attr.aria-label]="'Abrir menú'">
  ☰ Historial de conversaciones
</button>

<!-- Menú lateral -->
<div id="menu" [class.show]="isMobileMenuOpen || !isMobile" class="sidebar">
  <div id="logo" class="sidebar-header">
    <h1 class="text-lg md:text-2xl font-bold">LKS</h1>
    <p class="text-sm text-justify">
      Consultora tecnológica y de negocio que impulsa la transformación digital de empresas.
    </p>
  </div>

  <h2 class="sidebar-title">Historial de Conversaciones</h2>
  <hr class="barra" />

  <!-- Lista de conversaciones -->
  <ul class="conversation-list">
    <li *ngFor="let conv of conversations$ | async"
        (click)="openConversation(conv.id)"
        [class.selected]="conv.id === selectedChatId"
        class="conversation-item"
        [attr.aria-label]="'Seleccionar conversación ' + conv.title">
      <button class="conversation-title">{{ conv.title }}</button>
      <button class="delete-btn"
              (click)="deleteConversation(conv.id); $event.stopPropagation()"
              [attr.aria-label]="'Borrar conversación ' + conv.title">
        Borrar
      </button>
    </li>
  </ul>

  <!-- Campo de texto para crear una nueva conversación -->
  <div class="new-chat">
    <input id="nuevoChatInput" placeholder="Nuevo Chat" type="text"
           [(ngModel)]="newChatTitle" (keydown.enter)="createNewConversation()"
           class="nuevo-chat-input" [attr.aria-label]="'Título de nueva conversación'" />
    <button type="button" (click)="createNewConversation()"
            class="create-conversation-btn" [attr.aria-label]="'Añadir nueva conversación'">
      Añadir
    </button>
  </div>

  <!-- Botón para borrar todas las conversaciones -->
  <div class="clear-history-btn-container">
    <button type="button" (click)="clearHistory()"
            class="clear-history-btn" [attr.aria-label]="'Eliminar todas las conversaciones'">
      Eliminar Todo
    </button>
  </div>
</div>
