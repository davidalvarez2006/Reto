<style>
  :root {
    font-family: 'Inter', sans-serif;
  }

  @supports (font-variation-settings: normal) {
    :root {
      font-family: 'Inter var', sans-serif;
    }
  }

  #menu {
    display: flex;
    flex-direction: column;
    height: 100vh;
    background-color: #ff5c04;
    color: white;
    width: 16rem;
    position: fixed;
    left: -16rem; /* Ocultamos el menú fuera de la pantalla */
    top: 0;
    padding-bottom: 1rem;
    z-index: 10;
    transition: transform 0.3s ease; /* Animación de desplazamiento */
  }

  #menu.show {
    transform: translateX(16rem); /* El menú se mueve hacia la derecha cuando se muestra */
  }

  #logo {
    padding: 1rem 1.5rem;
  }

  .text {
    margin-left: 1.75em;
    margin-right: 1.75em;
    text-align: center;
    color: white;
  }

  .barra {
    margin-left: 1.75em;
    width: 12.5em;
  }

  ul {
    flex-grow: 1;
    overflow-y: auto;
    padding-left: 1.5em;
    padding-right: 1em;
  }

  .conver {
    margin-bottom: 0.2em;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5em;
    transition: background-color 0.3s ease, color 0.3s ease;
    border-radius: 1em;
    background-color: #ff6c1f;
  }

  .conver:hover {
    background-color: white;
    color: black;
  }

  .conver button {
    background: none;
    border: none;
    font-size: 1rem;
    cursor: pointer;
  }

  .conver button:first-child {
    font-weight: bold;
    margin-right: 1em;
  }

  .conver button:last-child {
    background-color: #ff3b3b;
    color: white;
    border-radius: 0.5em;
    padding: 0.3em 0.6em;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .conver button:last-child:hover {
    background-color: black;
    color: red;
  }

  .clear-history-btn,
  .create-conversation-btn {
    margin-left: 1.75em;
    margin-right: 1.5em;
    padding: 0.5em;
    background-color: #ff3b3b;
    color: white;
    border-radius: 1em;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.3s ease, color 0.3s ease;
    border: none;
    margin-bottom: 0.5em;
    margin-top: 0.5em;
  }

  .clear-history-btn:hover,
  .create-conversation-btn:hover {
    background-color: white;
    color: black;
  }

  .input-container {
    margin-top: 1rem;
    display: flex;
    justify-content: center;
  }

  .nuevo-chat-input {
    width: 13em;
    height: 3em;
    border-radius: 1em;
    padding-left: 0.5em;
    padding: 10px;
    margin-left: 1.5em;
    border: 1px solid #ccc;
  }

  .selected {
    background-color: red;
    color: white;
    font-weight: bold;
  }

  /* Modo responsive */
  @media (max-width: 768px) {
    #menu {
      position: absolute;
      top: 3.5em;
      left: 0;
      width: 100%;
      height: auto;
      display: none; /* Ocultamos el menú por defecto */
    }

    #menu.show {
      display: block; /* Mostramos el menú cuando tiene la clase 'show' */
      transform: translateX(0); /* El menú se mueve de su posición original */
    }

    .hamburger {
      background-color: #ff5c04;
      color: white;
      border: none;
      width: 100%;
      height: 3.5em;
      font-size: 1.2em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hamburger:focus {
      outline: none;
    }

    .barra{
      width: 92%;
    }

    .clear-history-btn{
      width: 92%;
    }

    #nuevoChatInput{
      width: 92%;
      margin-top: 2%;
    }
  }

</style>

<!-- Botón hamburguesa solo visible en móvil -->
<button class="hamburger" (click)="toggleMobileMenu()" *ngIf="isMobile">
  ☰ Historial de conversaciones
</button>

<!-- Menú lateral -->
<div id="menu" [class.show]="isMobileMenuOpen || !isMobile">
  <div id="logo">
    <h1 class="text-lg md:text-2xl font-bold">LKS</h1>
    <p class="text-1x1 text-justify">Consultora tecnológica y de negocio que impulsa la transformación digital de empresas.</p>
  </div>
  <h2 class="text">HISTORIAL DE CONVERSACIONES</h2>
  <hr class="barra" />
  <br />
  <ul>
    <li *ngFor="let conv of conversations$ | async" (click)="openConversation(conv.id)" [class.selected]="conv.id === selectedChatId" class="conver">
      <button>{{ conv.title }}</button>
      <button (click)="deleteConversation(conv.id); $event.stopPropagation()">Borrar</button>
    </li>
  </ul>
  <input id="nuevoChatInput" placeholder="Nuevo Chat" type="text" [(ngModel)]="newChatTitle" (keydown.enter)="createNewConversation()" class="nuevo-chat-input" />
  <button type="button" (click)="clearHistory()" class="clear-history-btn">Delete All</button>
</div>
